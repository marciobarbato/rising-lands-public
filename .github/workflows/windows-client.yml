# Windows client CI. No game data is needed. The Windows client is x86-64 only
# (decision of 2026-11-14; Windows on ARM may run the x64 build under its own
# emulation, unsupported; pre-alphas 1-3 also shipped an ARM64 build). Two builds,
# one artifact each:
#   mingw-x64   x86_64-pc-windows-gnu, mingw-w64 gcc (windows/build.sh)
#   msvc-x64    x86_64-pc-windows-msvc, cl.exe (windows/build-msvc.ps1)
# Both builds run the portable unit tests through the Win32 file APIs and
# windows/ci/smoke.sh (no game data): the engine ABI self-test, the importer's
# refusals (no CD, a non-CD file, broken .CUE, a folder without INSTALHD, a fake
# CD with the right names), the order queue markers through GDI and the first
# start's import dialogs, and the DPI mixed mode on real windows.
# Each artifact carries the .exe and its SHA-256, so anyone can match a
# pre-release binary to the commit it was built from. The builds are not signed
# (docs/WINDOWS_CLIENT.md, section 6).
name: windows-client
on:
  push:
    branches: [main]
    paths: ["windows/**", "engine/**", ".github/workflows/windows-client.yml"]
  pull_request:
    paths: ["windows/**", "engine/**", ".github/workflows/windows-client.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mingw-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust target
        run: rustup target add x86_64-pc-windows-gnu
      - name: Build and unit tests (mingw-w64 gcc)
        env:
          CC: gcc
          HOST_CC: gcc
        run: windows/build.sh test
      - name: Smokes without game data (self-test, import refusals, markers, window, first start)
        run: windows/ci/smoke.sh windows/build/RisingLands.exe
      - name: SHA-256
        shell: bash
        run: |
          cd windows/build
          sha256sum RisingLands.exe | tee RisingLands.exe.sha256
          echo "Commit: $GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: RisingLands-windows-x86_64-mingw
          path: |
            windows/build/RisingLands.exe
            windows/build/RisingLands.exe.sha256

  msvc-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit tests (MSVC x64)
        shell: pwsh
        run: windows/build-msvc.ps1 -Arch x64 -Test
      - name: Smokes without game data (self-test, import refusals, markers, window, first start)
        shell: bash
        run: windows/ci/smoke.sh windows/build/msvc-x64/RisingLands.exe
      - name: SHA-256
        shell: bash
        run: |
          cd windows/build/msvc-x64
          sha256sum RisingLands.exe | tee RisingLands.exe.sha256
          echo "Commit: $GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: RisingLands-windows-x86_64-msvc
          path: |
            windows/build/msvc-x64/RisingLands.exe
            windows/build/msvc-x64/RisingLands.exe.sha256
